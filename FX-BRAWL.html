<!DOCTYPE html>
<html lang="az">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>FX BRAWL</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}html,body{width:100%;height:100%;overflow:hidden;font-family:Arial,Helvetica,sans-serif;background:#070914;color:#fff}button,input{font-family:inherit}button{cursor:pointer}#app{width:100%;height:100%;position:relative;overflow:hidden;background:#0b0e1b}.screen{position:absolute;inset:0;display:none}.screen.active{display:flex}
#splash{align-items:center;justify-content:center;flex-direction:column;background:radial-gradient(circle at center,#34458f 0%,#151a3b 35%,#080a13 75%)}.logo{font-size:clamp(48px,12vw,95px);font-weight:1000;font-style:italic;letter-spacing:-4px;text-shadow:0 0 12px #55ddff,0 0 35px #287cff,6px 6px 0 #11152d;animation:logoPulse 1s infinite alternate}.sub{margin-top:8px;color:#a8edff;letter-spacing:5px;font-size:13px;font-weight:900}.loader{width:min(75%,430px);height:13px;margin-top:45px;padding:2px;border:2px solid #fff;border-radius:20px;background:#080a13}.bar{width:0%;height:100%;border-radius:20px;background:#54dcff;box-shadow:0 0 15px #54dcff}.loadText{margin-top:10px;color:#aab4db;font-size:12px}@keyframes logoPulse{from{transform:scale(1)}to{transform:scale(1.04)}}
#login{align-items:center;justify-content:center;padding:20px;background:radial-gradient(circle at 50% 25%,#28336c,#0a0c18 65%)}.card{width:min(92%,440px);padding:30px;border-radius:28px;background:#171b31ee;border:2px solid #3c4773;box-shadow:0 20px 70px #000b;text-align:center}.card h1{font-size:43px;margin-bottom:8px}.card h2{margin-bottom:12px}.card p{color:#aab3d2;line-height:1.5}.loginSub{color:#9da8cc;margin-bottom:25px}input{width:100%;padding:16px;border:0;outline:2px solid #303858;border-radius:15px;background:#090b15;color:#fff;font-size:16px;margin-bottom:12px}.btn{width:100%;padding:16px;border:0;border-radius:15px;background:#55dcff;color:#07101a;font-size:16px;font-weight:1000;margin-top:10px;box-shadow:0 7px 20px #55dcff33}.btn:active{transform:scale(.97)}.btn.alt{background:#303750;color:#fff}
#game{background:radial-gradient(circle at 50% 25%,#353d78,#10142a 55%,#080a13)}.top{position:absolute;left:0;right:0;top:0;height:78px;z-index:10;display:flex;align-items:center;justify-content:space-between;padding:10px 17px;background:#10142bef;border-bottom:1px solid #343c63}.profile{display:flex;align-items:center;gap:10px}.avatar{width:50px;height:50px;border-radius:50%;display:grid;place-items:center;font-size:25px;font-weight:900;background:linear-gradient(135deg,#56ddff,#6b62ff);border:3px solid white;box-shadow:0 0 15px #56ddff55}.playerText b{font-size:16px}.playerText small{color:#aeb8dc}.resources{display:flex;gap:7px}.res{padding:10px 12px;border-radius:13px;background:#272d4d;font-weight:900;white-space:nowrap;border:0;color:#fff}
.home{position:absolute;inset:78px 0 84px;display:flex;flex-direction:column;align-items:center;justify-content:center;overflow:hidden}.grid{position:absolute;inset:-20%;opacity:.22;background-image:linear-gradient(#6672a044 1px,transparent 1px),linear-gradient(90deg,#6672a044 1px,transparent 1px);background-size:55px 55px;transform:perspective(500px) rotateX(57deg) scale(1.3);transform-origin:center bottom}.light{position:absolute;border-radius:50%;filter:blur(20px);opacity:.35}.light.one{width:180px;height:180px;background:#3e9cff;left:-70px;top:80px}.light.two{width:200px;height:200px;background:#8a48ff;right:-90px;bottom:40px}.homeTitle{z-index:2;font-size:clamp(36px,8vw,70px);font-style:italic;font-weight:1000;text-shadow:0 6px 0 #202642}
.hero{position:relative;z-index:2;width:200px;height:285px;margin:4px;animation:breathe 1.7s ease-in-out infinite}@keyframes breathe{0%,100%{transform:translateY(0)}50%{transform:translateY(-7px)}}.head{position:absolute;left:55px;top:14px;width:92px;height:92px;border-radius:50%;background:#ffd0a2;border:4px solid #181b27;z-index:3}.hair{position:absolute;left:50px;top:5px;width:103px;height:50px;border-radius:55px 55px 25px 25px;background:#38232e;z-index:4;transform:rotate(-4deg)}.eye{position:absolute;width:11px;height:15px;top:48px;border-radius:50%;background:#111}.eye.left{left:22px}.eye.right{right:22px}.mouth{position:absolute;left:36px;top:68px;width:20px;height:8px;border-bottom:3px solid #111;border-radius:50%}.body{position:absolute;left:54px;top:103px;width:88px;height:105px;border-radius:28px 28px 20px 20px;background:linear-gradient(#537cff,#314fca);border:4px solid #181b27}.arm{position:absolute;top:108px;width:29px;height:91px;border-radius:20px;background:#ffd0a2;border:4px solid #181b27}.arm.left{left:22px;transform:rotate(18deg)}.arm.right{right:22px;transform:rotate(-20deg)}.leg{position:absolute;top:198px;width:32px;height:72px;border-radius:16px;background:#252b49;border:4px solid #181b27}.leg.left{left:56px}.leg.right{right:55px}.shoe{position:absolute;top:255px;width:43px;height:22px;border-radius:13px;background:#111522}.shoe.left{left:48px}.shoe.right{right:46px}.weapon{position:absolute;right:0;top:135px;width:76px;height:19px;border-radius:8px;background:#777f95;border:3px solid #171a25;transform:rotate(-15deg)}.weapon:after{content:"";position:absolute;right:-17px;top:2px;width:20px;height:10px;background:#272d42;border-radius:5px}.heroInfo{z-index:3;text-align:center}.heroInfo b{font-size:25px}.heroInfo div{margin-top:4px;color:#aab5d9}
.bottom{position:absolute;left:0;right:0;bottom:0;height:84px;z-index:10;display:flex;align-items:center;justify-content:space-around;background:#10142bf7;border-top:1px solid #343c63}.nav{min-width:70px;padding:7px;border:0;background:transparent;color:#aab3d3;font-size:12px;font-weight:900}.nav:active{transform:scale(.94)}.play{padding:17px 39px;border:0;border-radius:20px;background:#55dcff;color:#06101a;font-size:21px;font-weight:1000;box-shadow:0 8px 28px #55dcff55}.play:active{transform:scale(.94)}
.modal{position:absolute;inset:0;z-index:50;display:none;align-items:center;justify-content:center;padding:20px;background:#000b}.modal.show{display:flex}.modal .card{max-height:85vh;overflow:auto}.close{float:right;border:0;background:none;color:white;font-size:28px}.bigAvatar{width:90px;height:90px;margin:15px auto;font-size:45px}.boxIcon{width:120px;height:100px;margin:20px auto;position:relative}.boxBody{position:absolute;left:15px;top:25px;width:90px;height:65px;border-radius:12px;background:linear-gradient(#d9a83e,#87551e);border:5px solid #3c2615}.boxTop{position:absolute;left:8px;top:12px;width:104px;height:30px;border-radius:12px;background:#f0bd45;border:5px solid #3c2615}.boxLock{position:absolute;left:52px;top:34px;width:18px;height:25px;background:#e8d68c;border:3px solid #3c2615;z-index:3}.toast{position:absolute;left:50%;bottom:105px;z-index:100;transform:translateX(-50%);display:none;padding:13px 20px;border-radius:14px;background:white;color:#111;font-weight:900;white-space:nowrap;box-shadow:0 10px 30px #0008}
#battleScreen{position:absolute;inset:0;z-index:80;display:none;align-items:center;justify-content:center;flex-direction:column;background:radial-gradient(circle,#673346,#211522 50%,#09090f)}#battleScreen.show{display:flex}.battleTitle{font-size:clamp(34px,9vw,70px);font-weight:1000;font-style:italic}.battleSub{margin-top:10px;color:#c9cee6}.vs{display:flex;align-items:center;gap:35px;margin:30px}.team{text-align:center}.teamIcon{width:100px;height:100px;border-radius:25px;display:grid;place-items:center;font-size:45px;border:5px solid #fff}.blueTeam{background:#356bff}.redTeam{background:#e33f4d}.vsText{font-size:35px;font-weight:1000}.battleButton{width:220px;padding:15px;border:0;border-radius:15px;background:#55dcff;color:#07101a;font-weight:1000}
@media(max-height:560px){.top{height:62px}.home{inset:62px 0 66px}.bottom{height:66px}.hero{transform:scale(.72);margin:-25px}.homeTitle{font-size:35px}.heroInfo{transform:scale(.8)}}@media(max-width:420px){.resources .res{padding:8px 9px;font-size:13px}.top{padding:8px 10px}.play{padding:15px 28px}.nav{min-width:55px}}
</style>
</head>
<body>
<div id="app">
<section id="splash" class="screen active"><div class="logo">⚡ FX BRAWL</div><div class="sub">ORIGINAL ARENA</div><div class="loader"><div class="bar" id="bar"></div></div><div class="loadText" id="loadText">Yüklənir... 0%</div></section>
<section id="login" class="screen"><div class="card"><h1>⚡ FX BRAWL</h1><div class="loginSub">Arenaya xoş gəlmisən!</div><input id="name" type="text" maxlength="16" placeholder="Adını yaz..."><button class="btn" onclick="enterGame()">DAXİL OL</button><button class="btn alt" onclick="guest()">QONAQ KİMİ OYNA</button></div></section>
<section id="game" class="screen">
<header class="top"><div class="profile"><div class="avatar">⚡</div><div class="playerText"><b id="playerName">Player</b><br><small>🏆 <span id="trophies">0</span></small></div></div><div class="resources"><div class="res">💎 <span id="gems">20</span></div><button class="res" onclick="openSettings()">⚙️</button></div></header>
<main class="home"><div class="grid"></div><div class="light one"></div><div class="light two"></div><div class="homeTitle">FX BRAWL</div><div class="hero"><div class="hair"></div><div class="head"><div class="eye left"></div><div class="eye right"></div><div class="mouth"></div></div><div class="body"></div><div class="arm left"></div><div class="arm right"></div><div class="leg left"></div><div class="leg right"></div><div class="shoe left"></div><div class="shoe right"></div><div class="weapon"></div></div><div class="heroInfo"><b>FX</b><div>Hazır döyüşçü</div></div></main>
<footer class="bottom"><button class="nav" onclick="openProfile()">👤<br>PROFİL</button><button class="nav" onclick="openBox()">🎁<br>QUTU</button><button class="play" onclick="startBattle()">PLAY</button><button class="nav" onclick="openSettings()">⚙️<br>AYARLAR</button></footer>
</section>
<div id="profileModal" class="modal"><div class="card"><button class="close" onclick="closeModal('profileModal')">×</button><h2>👤 PROFİL</h2><div class="avatar bigAvatar">⚡</div><h3 id="profileName">Player</h3><br><p>🏆 Kuboklar: <b id="profileTrophies">0</b></p><p>💎 Gemlər: <b id="profileGems">20</b></p><br><button class="btn" onclick="changeName()">ADI DƏYİŞ</button></div></div>
<div id="boxModal" class="modal"><div class="card"><button class="close" onclick="closeModal('boxModal')">×</button><h2>🎁 FX QUTUSU</h2><div class="boxIcon"><div class="boxTop"></div><div class="boxBody"></div><div class="boxLock"></div></div><p>Qutunu aç və təsadüfi gem mükafatı qazan!</p><button class="btn" onclick="claimBox()">QUTUNU AÇ</button></div></div>
<div id="settingsModal" class="modal"><div class="card"><button class="close" onclick="closeModal('settingsModal')">×</button><h2>⚙️ AYARLAR</h2><br><button class="btn alt" onclick="toggleSound()">🔊 SƏS: <span id="soundText">AÇIQ</span></button><button class="btn alt" onclick="resetProgress()">🗑️ PROQRESİ SIFIRLA</button><button class="btn" onclick="logout()">🚪 HESABDAN ÇIX</button></div></div>
<div id="battleScreen"><div class="battleTitle">⚔️ BRAWL!</div><div class="battleSub" id="battleSub">Rəqib axtarılır...</div><div class="vs"><div class="team"><div class="teamIcon blueTeam">⚡</div><br><b>SƏN</b><br><span id="playerPower">100</span></div><div class="vsText">VS</div><div class="team"><div class="teamIcon redTeam">☠️</div><br><b>RƏQİB</b><br><span id="enemyPower">100</span></div></div><button class="battleButton" onclick="fight()" id="fightButton">DÖYÜŞƏ BAŞLA</button></div>
<div id="toast" class="toast"></div>
</div>
<script>
const $=id=>document.getElementById(id);function getName(){return localStorage.getItem('fx_brawl_name')||''}function getTrophies(){return Number(localStorage.getItem('fx_brawl_trophies')||0)}function getGems(){return Number(localStorage.getItem('fx_brawl_gems')||20)}function toast(t){const x=$('toast');x.textContent=t;x.style.display='block';clearTimeout(window.toastTimer);window.toastTimer=setTimeout(()=>x.style.display='none',1800)}function showScreen(id){document.querySelectorAll('.screen').forEach(s=>s.classList.remove('active'));$(id).classList.add('active')}function updateUI(){const n=getName()||'Player',t=getTrophies(),g=getGems();$('playerName').textContent=n;$('profileName').textContent=n;$('trophies').textContent=t;$('profileTrophies').textContent=t;$('gems').textContent=g;$('profileGems').textContent=g}function startGame(n){localStorage.setItem('fx_brawl_name',n||'Player');updateUI();showScreen('game')}function enterGame(){const n=$('name').value.trim();if(!n){toast('Adını yaz!');$('name').focus();return}startGame(n)}function guest(){startGame('Qonaq')}function openProfile(){updateUI();$('profileModal').classList.add('show')}function changeName(){const n=prompt('Yeni adını yaz:',getName());if(n===null)return;const x=n.trim();if(!x){toast('Ad boş ola bilməz!');return}localStorage.setItem('fx_brawl_name',x.substring(0,16));updateUI();toast('Ad dəyişdirildi!')}function closeModal(id){$(id).classList.remove('show')}function openSettings(){$('settingsModal').classList.add('show')}let soundOn=true;function toggleSound(){soundOn=!soundOn;$('soundText').textContent=soundOn?'AÇIQ':'BAĞLI';toast(soundOn?'🔊 Səs açıldı':'🔇 Səs bağlandı')}function openBox(){$('boxModal').classList.add('show')}function claimBox(){let g=getGems();const r=[1,2,3,5,8,10,25][Math.floor(Math.random()*7)];g+=r;localStorage.setItem('fx_brawl_gems',g);updateUI();toast('🎁 Qutudan 💎 +'+r+' gem çıxdı!');setTimeout(()=>closeModal('boxModal'),800)}let playerPower=100,enemyPower=100,battleRunning=false;function startBattle(){$('battleScreen').classList.add('show');$('battleSub').textContent='Rəqib axtarılır...';$('fightButton').disabled=true;playerPower=100;enemyPower=100;$('playerPower').textContent=100;$('enemyPower').textContent=100;setTimeout(()=>{$('battleSub').textContent='Rəqib tapıldı!';$('fightButton').disabled=false},1200)}function fight(){if(battleRunning)return;battleRunning=true;$('fightButton').disabled=true;$('battleSub').textContent='⚔️ Savaş davam edir...';let rounds=0;const timer=setInterval(()=>{rounds++;enemyPower=Math.max(0,enemyPower-(Math.floor(Math.random()*22)+8));playerPower=Math.max(0,playerPower-(Math.floor(Math.random()*20)+7));$('playerPower').textContent=playerPower;$('enemyPower').textContent=enemyPower;if(rounds>=8||playerPower<=0||enemyPower<=0){clearInterval(timer);finishBattle()}},350)}function finishBattle(){battleRunning=false;const win=enemyPower<=0?true:playerPower<=0?false:playerPower>=enemyPower;let t=getTrophies();if(win){t=Math.min(10000,t+10);$('battleSub').textContent='🏆 QƏLƏBƏ! +10 KUBOK';toast('🏆 Qələbə! +10 kubok')}else{t=Math.max(0,t-5);$('battleSub').textContent='💥 MƏĞLUBİYYƏT -5 KUBOK';toast('💥 Məğlubiyyət -5 kubok')}localStorage.setItem('fx_brawl_trophies',t);updateUI();$('fightButton').disabled=false;$('fightButton').textContent='DAVAM ET';$('fightButton').onclick=closeBattleAfterResult}function closeBattleAfterResult(){$('battleScreen').classList.remove('show');$('fightButton').textContent='DÖYÜŞƏ BAŞLA';$('fightButton').onclick=fight;$('battleSub').textContent='Rəqib axtarılır...';playerPower=100;enemyPower=100;$('playerPower').textContent=100;$('enemyPower').textContent=100}function resetProgress(){if(!confirm('Bütün kubok və gem proqresini sıfırlamaq istəyirsən?'))return;localStorage.setItem('fx_brawl_trophies','0');localStorage.setItem('fx_brawl_gems','20');updateUI();toast('Proqres sıfırlandı!')}function logout(){if(!confirm('Hesabdan çıxmaq istəyirsən?'))return;localStorage.removeItem('fx_brawl_name');$('name').value='';closeModal('settingsModal');showScreen('login')}document.querySelectorAll('.modal').forEach(m=>m.addEventListener('click',e=>{if(e.target===m)m.classList.remove('show')}));let p=0;const loading=setInterval(()=>{p+=4;if(p>100)p=100;$('bar').style.width=p+'%';$('loadText').textContent='Yüklənir... '+p+'%';if(p>=100){clearInterval(loading);setTimeout(()=>{const n=getName();n?startGame(n):showScreen('login')},350)}},70);updateUI();
</script>
</body>
</html>
